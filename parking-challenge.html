<script>
(()=>{
const menu=document.getElementById('menu'),game=document.getElementById('game'),canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const levels=[
{start:[45,465],goal:[275,48],obs:[[95,350,110,20],[220,260,25,100],[65,160,100,20]]},
{start:[45,465],goal:[275,48],obs:[[90,370,25,90],[155,310,130,20],[55,220,120,20],[220,120,25,75]]},
{start:[45,465],goal:[275,48],obs:[[95,390,120,20],[235,320,25,100],[55,250,130,20],[205,170,100,20],[80,100,25,55]]},
{start:[45,465],goal:[275,48],obs:[[100,400,25,65],[200,335,100,20],[45,260,100,20],[225,185,25,65]]},
{start:[45,465],goal:[275,48],obs:[[95,410,95,20],[220,355,25,75],[45,290,120,20],[200,245,110,20],[70,180,25,65],[145,125,100,20],[260,165,25,65]],mines:[[120,455],[290,420],[65,330],[165,300],[300,270],[120,220],[275,190],[45,120],[180,90],[315,75]]},
{start:[45,475],goal:[275,55],underground:true,obs:[[95,405,25,75],[55,310,110,20],[225,285,25,85],[95,205,25,85],[165,190,120,20],[55,110,115,20],[235,95,25,65]]}
];
let level=0,car={x:45,y:465,angle:-Math.PI/2},keys={},held=null,finished=false;
const el=id=>document.getElementById(id);
function showMenu(){game.classList.remove('active');menu.classList.add('active');el('overlay').classList.remove('show')}
function start(){menu.classList.remove('active');game.classList.add('active');level=0;loadLevel()}
function loadLevel(){let d=levels[level];car={x:d.start[0],y:d.start[1],angle:-Math.PI/2};finished=false;el('levelLabel').textContent=`Nivel ${level+1} de 6`;el('status').textContent=d.underground?'Estacionamiento subterráneo':'Llega al estacionamiento verde';el('overlay').classList.remove('show');draw()}
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function draw(){let d=levels[level];ctx.clearRect(0,0,360,520);ctx.fillStyle=d.underground?'#27313c':'#397b52';ctx.fillRect(0,0,360,520);
// paved parking area and lane markings
rounded(16,12,328,496,12,d.underground?'#454e59':'#65727a',);
ctx.strokeStyle=d.underground?'#8b9299':'#dce6d7';ctx.lineWidth=3;ctx.setLineDash([15,12]);for(let x=45;x<340;x+=58){ctx.beginPath();ctx.moveTo(x,18);ctx.lineTo(x,502);ctx.stroke()}ctx.setLineDash([]);
// parking target
rounded(250,24,60,62,7,'#087e3b');ctx.strokeStyle='#7dff9b';ctx.lineWidth=3;ctx.strokeRect(254,28,52,54);ctx.fillStyle='white';ctx.font='bold 34px Arial';ctx.textAlign='center';ctx.fillText('P',280,67);
// obstacles
for(let [x,y,w,h] of d.obs){rounded(x,y,w,h,5,'#29323b');ctx.fillStyle='#89949b';ctx.fillRect(x+3,y+3,w-6,4);ctx.fillStyle='#111923';ctx.fillRect(x+4,y+h-7,w-8,3)}
// mines on level 5, stylized and non-graphic
for(let [x,y] of (d.mines||[])){ctx.fillStyle='#1a1720';ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffbf47';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#ffdb65';ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill()}
// car
ctx.save();ctx.translate(car.x,car.y);ctx.rotate(car.angle+Math.PI/2);ctx.fillStyle='#111';ctx.fillRect(-12,-19,6,12);ctx.fillRect(6,-19,6,12);ctx.fillRect(-12,7,6,12);ctx.fillRect(6,7,6,12);rounded(-10,-22,20,44,7,'#e52231');rounded(-7,-12,14,19,5,'#202d42');ctx.fillStyle='#b8e6ff';ctx.fillRect(-6,-10,12,3);ctx.fillStyle='#fff3a8';ctx.fillRect(-7,-20,4,3);ctx.fillRect(3,-20,4,3);ctx.fillStyle='#ff8c8c';ctx.fillRect(-7,18,4,2);ctx.fillRect(3,18,4,2);ctx.restore();
}
function hitRect(x,y,r){return x+r>0&&y+r>0&&x-r<360&&y-r<520}
function move(dx,dy){if(finished)return;let nx=car.x+dx,ny=car.y+dy;if(!hitRect(nx,ny,10))return;let d=levels[level];for(let [x,y,w,h] of d.obs){if(nx+9>x&&nx-9<x+w&&ny+17>y&&ny-17<y+h)return}for(let [x,y] of (d.mines||[])){if(Math.hypot(nx-x,ny-y)<18){car={x:d.start[0],y:d.start[1],angle:-Math.PI/2};draw();el('status').textContent='¡Inténtalo otra vez!';return}}car.x=nx;car.y=ny;draw();if(nx>250&&nx<310&&ny>24&&ny<88){finished=true;el('dialogTitle').textContent=level===5?'¡Completaste los 6 niveles!':'¡Nivel completado!';el('dialogText').textContent=level===5?'¡Excelente conducción! Terminaste PARKING CHALLENGE.':'Has encontrado el estacionamiento. ¡Sigue así!';el('continue').textContent=level===5?'Volver al menú':'Siguiente nivel';el('overlay').classList.add('show')}}
function tick(){if(!game.classList.contains('active')||finished)return;const left=keys.ArrowLeft||keys.a||held==='left',right=keys.ArrowRight||keys.d||held==='right';const forward=keys.ArrowUp||keys.w||held==='up',backward=keys.ArrowDown||keys.s||held==='down';let turned=false;if(left){car.angle-=0.055;turned=true}if(right){car.angle+=0.055;turned=true}if(forward||backward){const speed=backward?-2.6:2.6;move(Math.cos(car.angle)*speed,Math.sin(car.angle)*speed)}else if(turned){draw()}requestAnimationFrame(tick)}
el('play').addEventListener('click',()=>{start();requestAnimationFrame(tick)});el('exit').addEventListener('click',()=>{el('dialogTitle').textContent='¡Gracias por jugar!';el('dialogText').textContent='Puedes volver cuando quieras.';el('continue').textContent='Volver al menú';el('overlay').classList.add('show');menu.classList.remove('active');game.classList.add('active');el('back').style.visibility='hidden';el('restart').style.visibility='hidden'});
el('back').addEventListener('click',()=>{el('back').style.visibility='visible';el('restart').style.visibility='visible';showMenu()});el('restart').addEventListener('click',loadLevel);
el('continue').addEventListener('click',()=>{if(el('dialogTitle').textContent==='¡Gracias por jugar!'){el('back').style.visibility='visible';el('restart').style.visibility='visible';showMenu();return}if(level===5){showMenu();return}level++;loadLevel();requestAnimationFrame(tick)});
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;keys[e.key.toLowerCase()]=true});window.addEventListener('keyup',e=>{keys[e.key]=false;keys[e.key.toLowerCase()]=false});document.querySelectorAll('[data-dir]').forEach(b=>{const down=e=>{e.preventDefault();held=b.dataset.dir},up=e=>{e.preventDefault();if(held===b.dataset.dir)held=null};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up)});
})();
